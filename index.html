<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidak's Tracker</title>
<meta name="description" content="6-day push/pull/legs hypertrophy tracker">
<meta name="theme-color" content="#141319">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sidak's Tracker">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#141319;
  --surface:#1f1c27;
  --surface-2:#2a2632;
  --border:#3a3440;
  --text:#ece8f2;
  --text-dim:#a79fb3;
  --text-faint:#766d81;
  --accent:#8f7be0;
  --accent-soft:#8f7be026;
  --accent-2:#3f7d78;
  --good:#86a06f;
  --rest:#b0966c;
  --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 30px -14px rgba(0,0,0,0.6);
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Work Sans',ui-sans-serif,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{
  max-width:640px;
  margin:0 auto;
  padding:18px 16px 56px;
}

/* header */
header.top{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.title-block h1{
  font-family:'Big Shoulders Display',sans-serif;
  font-weight:700; font-size:18px; letter-spacing:0.04em; text-transform:uppercase;
  margin:0; color:var(--text-dim);
}
.sync-pill{
  display:inline-flex; align-items:center; gap:6px;
  font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--good);
  border:1px solid var(--border); border-radius:20px; padding:4px 9px 4px 7px; white-space:nowrap;
}
.sync-pill .sdot{width:6px;height:6px;border-radius:50%;background:var(--good);}

/* date navigator */
.date-nav{
  display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--border); border-radius:18px;
  box-shadow:var(--shadow); padding:16px 6px; margin:16px 0 16px;
}
.nav-arrow{
  flex-shrink:0; width:46px; height:46px; border-radius:13px;
  background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
  font-size:21px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition: background .15s ease, color .15s ease, border-color .15s ease, transform .08s ease;
}
.nav-arrow:hover{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
.nav-arrow:active{ transform:scale(0.92); }
.date-center{ flex:1; min-width:0; text-align:center; overflow:hidden; }
.wd-row{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
.wd-big{ font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-faint); }
.today-badge{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--accent); border:1px solid var(--accent); border-radius:20px; padding:1.5px 8px; }
.today-chip{ font-family:'Work Sans',sans-serif; font-size:11px; color:var(--text-dim); background:none; border:1px solid var(--border); border-radius:20px; padding:2.5px 10px; cursor:pointer; }
.today-chip:hover{ border-color:var(--text-faint); color:var(--text); }
.date-big{ font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:clamp(30px,9vw,40px); line-height:1; margin:3px 0 5px; color:var(--text); }
.date-big.rest{ color:var(--rest); }
.focus-big{ font-size:14px; color:var(--text-dim); }

.panel-inner.slide-next{ animation: slideFromRight .32s cubic-bezier(.22,.7,.3,1); }
.panel-inner.slide-prev{ animation: slideFromLeft .32s cubic-bezier(.22,.7,.3,1); }
.date-center.slide-next{ animation: slideFromRight .32s cubic-bezier(.22,.7,.3,1); }
.date-center.slide-prev{ animation: slideFromLeft .32s cubic-bezier(.22,.7,.3,1); }
@keyframes slideFromRight{ from{opacity:0; transform:translateX(16px);} to{opacity:1; transform:translateX(0);} }
@keyframes slideFromLeft{ from{opacity:0; transform:translateX(-16px);} to{opacity:1; transform:translateX(0);} }

/* panel */
.panel{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  box-shadow:var(--shadow); padding:18px 16px 14px;
}
.panel-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:6px; flex-wrap:wrap; }
.panel-head .sub{ color:var(--text-dim); font-size:13px; }
.progress-pill{ display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--text-dim); }
.progress-pill .track{ width:74px; height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; }
.progress-pill .track i{ display:block; height:100%; background:var(--accent); width:0%; transition:width .3s ease; }
.reset-btn{ background:none; border:1px solid var(--border); color:var(--text-dim); font-size:12px; padding:6px 11px; border-radius:8px; cursor:pointer; }
.reset-btn:hover{ border-color:var(--text-faint); color:var(--text); }

.rest-note{ padding:22px 2px 26px; color:var(--text-dim); font-size:14.5px; line-height:1.6; }
.rest-note b{ color:var(--text); font-family:'Big Shoulders Display',sans-serif; font-size:20px; display:block; margin-bottom:6px; letter-spacing:0.02em; }

/* accordion sections */
.acc{ border-top:1px solid var(--border); }
.acc:first-of-type{ margin-top:10px; }
.acc-head{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:none; border:none; cursor:pointer; padding:13px 2px; color:var(--text);
  font-family:'Big Shoulders Display',sans-serif; font-weight:600; font-size:14.5px;
  letter-spacing:0.07em; text-transform:uppercase;
}
.acc-left{ display:flex; align-items:center; gap:9px; color:var(--text-faint); }
.acc.main .acc-left .dot{ background:var(--accent); }
.acc-left .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent-2); flex-shrink:0; }
.acc-right{ display:flex; align-items:center; gap:10px; }
.acc-count{ font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0; text-transform:none; color:var(--text-dim); }
.chev{ display:inline-block; color:var(--text-faint); transition:transform .2s ease; font-size:12px; }
.acc.open .chev{ transform:rotate(90deg); color:var(--accent); }
.section-body{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .28s ease; }
.acc.open .section-body{ grid-template-rows:1fr; }
.section-inner{ overflow:hidden; min-height:0; }

.ex-row{ display:flex; align-items:center; gap:12px; padding:13px 2px; border-top:1px dashed var(--border); }
.section-inner .ex-row:first-child{ border-top:none; }
.ex-main{ flex:1; min-width:0; }
.ex-name{ font-size:16px; font-weight:500; color:var(--text); line-height:1.35; }
.ex-scheme{ font-family:'JetBrains Mono',monospace; font-size:13.5px; color:var(--text-dim); white-space:nowrap; min-width:64px; text-align:right; font-variant-numeric:tabular-nums; }
.sets{ display:flex; gap:8px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; max-width:150px; }
.setbox{
  width:32px; height:32px; border-radius:9px; border:1.5px solid var(--border); background:var(--surface-2);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:background .12s ease, border-color .12s ease;
}
.setbox:hover{ border-color:var(--text-faint); }
.setbox.on{ background:var(--accent); border-color:var(--accent); }
.setbox.on::after{ content:""; width:13px; height:8px; border-left:2.5px solid var(--surface); border-bottom:2.5px solid var(--surface); transform:rotate(-45deg) translate(1.5px,-1.5px); }
.acc.core .setbox.on, .acc.cooldown .setbox.on, .acc.warmup .setbox.on{ background:var(--accent-2); border-color:var(--accent-2); }
.setbox.pop{ animation:pop .35s ease; }
@keyframes pop{ 0%{transform:scale(1);} 45%{transform:scale(1.3);} 100%{transform:scale(1);} }

.spark{
  position:fixed; width:5px; height:5px; border-radius:50%; pointer-events:none; z-index:999;
  transform:translate(-50%,-50%); animation:spark-fly .5s ease-out forwards;
}
@keyframes spark-fly{
  0%{ transform:translate(-50%,-50%) translate(0,0) scale(1); opacity:1; }
  100%{ transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(0.3); opacity:0; }
}

/* progress chart */
.chart-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 16px 12px; margin-top:14px; box-shadow:var(--shadow); }
.chart-head{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
.chart-head h3{ font-family:'Big Shoulders Display',sans-serif; font-weight:600; font-size:13px; letter-spacing:0.09em; text-transform:uppercase; color:var(--text-faint); margin:0; }
.chart-stat{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-dim); }
.chart-stat b{ color:var(--text); font-weight:600; }
svg.chart{ width:100%; height:auto; display:block; overflow:visible; }
svg.chart text{ font-family:'JetBrains Mono',monospace; }

footer{ text-align:center; color:var(--text-faint); font-size:11px; margin-top:20px; font-family:'JetBrains Mono',monospace; letter-spacing:0.02em; }

@media (max-width:420px){
  .setbox{ width:30px; height:30px; }
  .sets{ max-width:130px; }
  .ex-scheme{ min-width:56px; font-size:12.5px; }
}
@media (prefers-reduced-motion:reduce){
  .panel-inner, .date-center, .setbox.pop{ animation:none !important; }
  .spark{ display:none; }
  *{ transition-duration:.001ms !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title-block"><h1>Sidak's Tracker</h1></div>
    <div class="sync-pill"><span class="sdot"></span><span>saved on this phone</span></div>
  </header>

  <div class="date-nav">
    <button class="nav-arrow" id="prevBtn" aria-label="Previous day">&#8249;</button>
    <div class="date-center" id="dateCenter"></div>
    <button class="nav-arrow" id="nextBtn" aria-label="Next day">&#8250;</button>
  </div>

  <div class="panel" id="panel"></div>

  <div class="chart-card">
    <div class="chart-head">
      <h3>Weekly progress</h3>
      <div class="chart-stat" id="chartStat"></div>
    </div>
    <svg class="chart" id="chartSvg" viewBox="0 0 640 160"></svg>
  </div>

  <footer>tap a box to log a set &middot; your history stays on this device</footer>
</div>

<script>
const PLAN = [
  { name:"Monday", focus:"Push A · Chest", type:"train",
    warmup:[
      ["Stationary bike or treadmill incline walk","1","5 min"],
      ["Arm circles, forward then backward","1","15/direction"],
      ["Band or towel pull-apart, chest height","2","15"],
      ["Bodyweight push-ups, controlled tempo","2","12"],
      ["Empty-barbell bench press, warm-up set","1","15"]
    ],
    main:[
      ["Flat Barbell Bench Press, medium grip","4","6–10"],
      ["Incline Dumbbell Press, neutral grip","3","8–12"],
      ["Pec-Deck Machine Fly (or Cable Crossover)","3","12–15"],
      ["Seated Dumbbell Shoulder Press","3","8–12"],
      ["Cable Rope Triceps Pushdown, elbows pinned","3","10–15"]
    ],
    core:[["Hanging Knee Raise","3","12–15"]],
    cooldown:[
      ["Doorway chest stretch","2","30 sec"],
      ["Overhead triceps stretch, each arm","2","30 sec/side"]
    ]
  },
  { name:"Tuesday", focus:"Pull A · Back width", type:"train",
    warmup:[
      ["Stationary bike or rowing machine, easy pace","1","5 min"],
      ["Arm swings across chest","1","15"],
      ["Band pull-apart, chest height","2","15"],
      ["Scapular pull-ups, hang and shrug","2","10"],
      ["Lat pulldown, wide grip, warm-up weight","1","12"]
    ],
    main:[
      ["Wide-Grip Lat Pulldown (or Pull-Ups)","4","6–10"],
      ["Seated Cable Row, close neutral grip","3","10–12"],
      ["Barbell Bent-Over Row, overhand medium grip","3","8–12"],
      ["Face Pull, rope, high pulley","3","15–20"],
      ["EZ-Bar Curl, shoulder-width grip","3","8–12"]
    ],
    core:[["Cable Woodchopper, high-to-low, single handle","3","12/side"]],
    cooldown:[
      ["Lat stretch, side reach","2","30 sec/side"],
      ["Biceps wall stretch","2","30 sec/side"]
    ]
  },
  { name:"Wednesday", focus:"Legs A · Quads + joints", type:"train",
    warmup:[
      ["Stationary bike","1","5 min"],
      ["Bodyweight squats","2","15"],
      ["Leg swings, front-to-back","1","12/side"],
      ["Walking lunges, bodyweight","1","10/leg"],
      ["Ankle circles","1","10/direction"]
    ],
    main:[
      ["Barbell Back Squat, high-bar, shoulder-width","4","6–10"],
      ["Leg Press, feet shoulder-width","3","10–12"],
      ["Walking Lunge, dumbbells at sides","3","12/leg"],
      ["Leg Extension Machine","3","12–15"],
      ["Standing Calf Raise Machine","4","12–15"]
    ],
    core:[["Cable Crunch, kneeling, high pulley","3","15"]],
    cooldown:[
      ["Deep bodyweight squat hold","3","30 sec"],
      ["Couch stretch, quad/hip flexor","2","30 sec/side"],
      ["Standing hamstring stretch","2","30 sec/side"]
    ]
  },
  { name:"Thursday", focus:"Push B · Shoulders", type:"train",
    warmup:[
      ["Rowing machine or bike, easy pace","1","5 min"],
      ["Arm circles","1","15/direction"],
      ["Towel pass-through or band dislocate","2","10"],
      ["Wall slides, back flat against wall","2","12"],
      ["Push-ups, moderate pace","1","10"]
    ],
    main:[
      ["Seated Barbell Overhead Press","4","6–10"],
      ["Incline Barbell or Dumbbell Bench Press","3","8–12"],
      ["Dumbbell Lateral Raise, standing","3","12–15"],
      ["Parallel-Bar or Bench Dips, torso upright","3","8–12"],
      ["EZ-Bar Skull Crusher, lying flat bench","3","10–12"]
    ],
    core:[["Forearm Plank","3","45–60 sec"]],
    cooldown:[
      ["Cross-body shoulder stretch","2","30 sec/side"],
      ["Doorway chest stretch","2","30 sec"]
    ]
  },
  { name:"Friday", focus:"Pull B · Back thickness + arms", type:"train",
    warmup:[
      ["Stationary bike or rowing machine, easy pace","1","5 min"],
      ["Band pull-apart","2","15"],
      ["Cat-Cow","1","10"],
      ["Empty-barbell Romanian deadlift, light","1","10"],
      ["Scapular pulls on bar","1","10"]
    ],
    main:[
      ["Conventional Deadlift, double-overhand grip","4","5–8"],
      ["T-Bar Row, landmine/barbell-in-corner, close grip","3","8–12"],
      ["Lat Pulldown, close underhand grip","3","10–12"],
      ["Barbell Shrug, overhand grip","3","12–15"],
      ["Incline Dumbbell Curl","3","10–12"]
    ],
    core:[["Hanging Knee Raise","3","15"]],
    cooldown:[
      ["Child's Pose","1","45 sec"],
      ["Forearm & wrist stretch","2","20 sec/side"]
    ]
  },
  { name:"Saturday", focus:"Legs B · Hams/glutes + mobility", type:"train",
    warmup:[
      ["Stationary bike","1","5 min"],
      ["Glute bridges, bodyweight","2","15"],
      ["Leg swings, side-to-side","1","12/side"],
      ["Bodyweight hip hinge (RDL pattern)","1","10"],
      ["Hip circles","1","10/direction"]
    ],
    main:[
      ["Romanian Deadlift, barbell, overhand grip","4","8–10"],
      ["Bulgarian Split Squat, dumbbells at sides","3","10–12/leg"],
      ["Lying or Seated Leg Curl Machine","3","12–15"],
      ["Leg Press, feet high and wide","3","10–12"],
      ["Seated Calf Raise Machine","4","15–20"]
    ],
    core:[["Side Plank, each side","3","30 sec/side"]],
    cooldown:[
      ["World's Greatest Stretch","2","6/side"],
      ["90/90 Hip Stretch","2","45 sec/side"],
      ["Pigeon Pose","2","45 sec/side"],
      ["Shoulder CARs, controlled rotations","1","5/direction"],
      ["Cobra Stretch, lower back","2","30 sec"]
    ]
  },
  { name:"Sunday", focus:"Rest", type:"rest",
    note:"Full rest — no lifting. Optional: 15–20 min easy walk, light full-body stretch, or foam rolling if you're sore. This is where the muscle actually grows back thicker; don't trade it for a bonus session."
  }
];

function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function planIndex(d){ const jd=d.getDay(); return jd===0?6:jd-1; }
function startOfWeekMon(d){ const idx=planIndex(d); return addDays(d,-idx); }
function sameDate(a,b){ return isoDate(a)===isoDate(b); }
function reducedMotion(){ return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; }

const TODAY = new Date(); TODAY.setHours(0,0,0,0);
let selected = new Date(TODAY);
let navDir = null;
let expanded = { warmup:false, main:true, core:false, cooldown:false };

const LKEY = "iron-ledger-standalone-v1";
let STORE = {};
try{ STORE = JSON.parse(localStorage.getItem(LKEY) || "{}"); }catch(e){ STORE = {}; }
function saveLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify(STORE)); }catch(e){} }
function dayData(iso){ if(!STORE[iso]) STORE[iso] = {}; return STORE[iso]; }

function sectionExercises(day){
  if(day.type==="rest") return [];
  return [
    ...day.warmup.map((e,idx)=>({sec:"warmup",idx,e})),
    ...day.main.map((e,idx)=>({sec:"main",idx,e})),
    ...day.core.map((e,idx)=>({sec:"core",idx,e})),
    ...day.cooldown.map((e,idx)=>({sec:"cooldown",idx,e}))
  ];
}

function dayProgress(iso, day){
  if(day.type==="rest") return {done:0,total:0};
  const data = dayData(iso);
  let done=0, total=0;
  sectionExercises(day).forEach(({sec,idx,e})=>{
    const sets = parseInt(e[1],10);
    total += sets;
    const arr = data[sec+idx] || [];
    done += arr.filter(Boolean).length;
  });
  return {done,total};
}

function sectionProgress(list, sec, data){
  let done=0, total=0;
  list.forEach((e,idx)=>{
    const sets = parseInt(e[1],10);
    total += sets;
    const arr = data[sec+idx] || [];
    done += arr.filter(Boolean).length;
  });
  return {done,total};
}

function renderDateNav(){
  const day = PLAN[planIndex(selected)];
  const isToday = sameDate(selected,TODAY);
  const wd = selected.toLocaleDateString(undefined,{weekday:"long"}).toUpperCase();
  const dm = selected.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  const focus = day.type==="rest" ? "Rest day" : day.focus;
  const dc = document.getElementById("dateCenter");
  dc.className = "date-center" + (navDir==="next" ? " slide-next" : navDir==="prev" ? " slide-prev" : "");
  dc.innerHTML = `
    <div class="wd-row">
      <span class="wd-big">${wd}</span>
      ${isToday ? '<span class="today-badge">Today</span>' : '<button class="today-chip" id="todayChip">Jump to today</button>'}
    </div>
    <div class="date-big ${day.type==='rest'?'rest':''}">${dm}</div>
    <div class="focus-big">${focus}</div>
  `;
  const chip = document.getElementById("todayChip");
  if(chip) chip.addEventListener("click", ()=>{ navDir=null; selected=new Date(TODAY); renderAll(); });
}

function accSection(title, sec, list, iso, data){
  if(!list.length) return "";
  const prog = sectionProgress(list, sec, data);
  const isOpen = expanded[sec];
  const rows = list.map((e,idx)=>{
    const sets = parseInt(e[1],10);
    const arr = data[sec+idx] || (data[sec+idx] = new Array(sets).fill(false));
    const boxes = Array.from({length:sets}).map((_,s)=>`<div class="setbox ${arr[s]?"on":""}" data-sec="${sec}" data-idx="${idx}" data-s="${s}"></div>`).join("");
    return `
      <div class="ex-row">
        <div class="ex-main"><div class="ex-name">${e[0]}</div></div>
        <div class="ex-scheme">${e[1]}&times;${e[2]}</div>
        <div class="sets">${boxes}</div>
      </div>`;
  }).join("");
  return `
    <section class="acc ${sec} ${isOpen?"open":""}" data-sec="${sec}">
      <button class="acc-head" type="button" aria-expanded="${isOpen}">
        <span class="acc-left"><span class="dot"></span>${title}</span>
        <span class="acc-right"><span class="acc-count">${prog.done}/${prog.total}</span><span class="chev">&#9656;</span></span>
      </button>
      <div class="section-body"><div class="section-inner">${rows}</div></div>
    </section>`;
}

function renderPanel(){
  const panel = document.getElementById("panel");
  const day = PLAN[planIndex(selected)];
  const iso = isoDate(selected);
  const slideClass = navDir==="next" ? " slide-next" : navDir==="prev" ? " slide-prev" : "";

  if(day.type==="rest"){
    panel.innerHTML = `<div class="panel-inner${slideClass}"><div class="rest-note"><b>Recovery day</b>${day.note}</div></div>`;
    return;
  }

  const data = dayData(iso);
  const p = dayProgress(iso, day);
  const pct = p.total ? Math.round(100*p.done/p.total) : 0;

  panel.innerHTML = `
    <div class="panel-inner${slideClass}">
      <div class="panel-head">
        <div class="sub">${p.done} of ${p.total} sets logged</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="progress-pill"><span>${pct}%</span><div class="track"><i style="width:${pct}%"></i></div></div>
          <button class="reset-btn" id="resetBtn">Reset day</button>
        </div>
      </div>
      ${accSection("Warm-up","warmup", day.warmup, iso, data)}
      ${accSection("Main lifts","main", day.main, iso, data)}
      ${accSection("Core","core", day.core, iso, data)}
      ${accSection("Cooldown & flexibility","cooldown", day.cooldown, iso, data)}
    </div>
  `;

  panel.querySelectorAll(".acc-head").forEach(head=>{
    head.addEventListener("click", ()=>{
      const acc = head.closest(".acc");
      const sec = acc.dataset.sec;
      expanded[sec] = !expanded[sec];
      acc.classList.toggle("open", expanded[sec]);
      head.setAttribute("aria-expanded", expanded[sec]);
    });
  });

  panel.querySelectorAll(".setbox").forEach(box=>{
    box.addEventListener("click", ()=>{
      const sec = box.dataset.sec, idx = box.dataset.idx, s = +box.dataset.s;
      const turningOn = !data[sec+idx][s];
      data[sec+idx][s] = turningOn;
      saveLocal();
      box.classList.toggle("on", turningOn);
      if(turningOn){
        box.classList.remove("pop"); void box.offsetWidth; box.classList.add("pop");
        box.addEventListener("animationend", ()=>box.classList.remove("pop"), {once:true});
        spawnSparks(box);
      }
      updateProgressUI(iso, day);
      renderChart();
    });
  });

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    STORE[iso] = {};
    saveLocal();
    navDir = null;
    renderAll();
  });
}

function updateProgressUI(iso, day){
  const panel = document.getElementById("panel");
  const data = dayData(iso);
  const p = dayProgress(iso, day);
  const pct = p.total ? Math.round(100*p.done/p.total) : 0;
  const sub = panel.querySelector(".sub");
  if(sub) sub.textContent = `${p.done} of ${p.total} sets logged`;
  const pillSpan = panel.querySelector(".progress-pill span");
  if(pillSpan) pillSpan.textContent = pct+"%";
  const track = panel.querySelector(".progress-pill .track i");
  if(track) track.style.width = pct+"%";
  ["warmup","main","core","cooldown"].forEach(sec=>{
    const list = day[sec];
    if(!list || !list.length) return;
    const sp = sectionProgress(list, sec, data);
    const el = panel.querySelector(`.acc[data-sec="${sec}"] .acc-count`);
    if(el) el.textContent = `${sp.done}/${sp.total}`;
  });
}

function spawnSparks(el){
  if(reducedMotion()) return;
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  const color = getComputedStyle(el).backgroundColor;
  const n = 6;
  for(let i=0;i<n;i++){
    const s = document.createElement("span");
    s.className = "spark";
    const ang = (Math.PI*2*i/n) + (Math.random()*0.6-0.3);
    const dist = 15 + Math.random()*10;
    s.style.left = cx+"px"; s.style.top = cy+"px";
    s.style.background = color;
    s.style.setProperty("--dx", Math.cos(ang)*dist+"px");
    s.style.setProperty("--dy", Math.sin(ang)*dist+"px");
    document.body.appendChild(s);
    s.addEventListener("animationend", ()=>s.remove(), {once:true});
  }
}

function weekTotalsFor(weekStart){
  let done=0, total=0;
  for(let i=0;i<7;i++){
    const d = addDays(weekStart,i);
    const day = PLAN[planIndex(d)];
    if(day.type==="rest") continue;
    const p = dayProgress(isoDate(d), day);
    done += p.done; total += p.total;
  }
  return {done,total};
}

function renderChart(){
  const svg = document.getElementById("chartSvg");
  const nWeeks = 8;
  const thisWeekStart = startOfWeekMon(TODAY);
  const weeks = [];
  for(let i=nWeeks-1;i>=0;i--) weeks.push(addDays(thisWeekStart,-7*i));
  const totals = weeks.map(weekTotalsFor);
  const max = Math.max(1, ...totals.map(t=>t.total || t.done || 6));

  const W=640,H=160, padL=28, padR=8, padT=10, padB=26;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const bw = plotW/nWeeks*0.56;
  const gap = plotW/nWeeks;

  let bars="";
  totals.forEach((t,i)=>{
    const x = padL + i*gap + (gap-bw)/2;
    const h = Math.max(2, (t.done/max)*plotH);
    const y = padT + plotH - h;
    const isCur = i===nWeeks-1;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${isCur?"var(--accent)":"var(--accent-2)"}" opacity="${isCur?1:0.72}"></rect>`;
    if(t.done>0){
      bars += `<text x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--text-dim)">${t.done}</text>`;
    }
    const lbl = weeks[i].toLocaleDateString(undefined,{month:"short",day:"numeric"});
    bars += `<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--text-faint)">${lbl}</text>`;
  });
  const gridline = `<line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="var(--border)" stroke-width="1"></line>`;

  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.innerHTML = gridline + bars;

  const wk = totals[totals.length-1];
  const best = Math.max(...totals.map(t=>t.done));
  document.getElementById("chartStat").innerHTML = `this week <b>${wk.done}</b> sets &middot; best week <b>${best}</b>`;
}

function renderAll(){
  renderDateNav();
  renderPanel();
  renderChart();
  navDir = null;
}

document.getElementById("prevBtn").addEventListener("click",()=>{ navDir="prev"; selected = addDays(selected,-1); renderAll(); });
document.getElementById("nextBtn").addEventListener("click",()=>{ navDir="next"; selected = addDays(selected,1); renderAll(); });

renderAll();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
</script>
